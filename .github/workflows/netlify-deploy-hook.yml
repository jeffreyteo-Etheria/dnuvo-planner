name: Trigger Netlify Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Validate build hook secret exists
        run: |
          if [ -z "${{ secrets.NETLIFY_BUILD_HOOK }}" ]; then
            echo "Missing NETLIFY_BUILD_HOOK secret."
            echo "Add it in GitHub: Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Trigger Netlify build hook
        run: |
          curl -fsS -X POST "${{ secrets.NETLIFY_BUILD_HOOK }}"
          echo "Netlify deploy hook triggered."
